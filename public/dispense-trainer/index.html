<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PracticeRx Dispense Trainer</title>
    <meta
      name="description"
      content="PracticeRx Dispense Trainer is an original, fictional pharmacy dispensing workflow simulator for training and study."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f596c'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white'%3ERx%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">Rx</div>
          <div>
            <p class="eyebrow">Offline training workspace</p>
            <h1>PracticeRx Dispense Trainer</h1>
          </div>
        </div>
        <div class="header-meta">
          <div class="header-stat">
            <span class="header-stat__label">Pending queue</span>
            <strong id="header-pending-count">0</strong>
          </div>
          <div class="header-stat">
            <span class="header-stat__label">Dispensed today</span>
            <strong id="header-dispensed-count">0</strong>
          </div>
        </div>
      </header>

      <div class="disclaimer-banner" role="note">
        Training Simulator for pharmacy dispensing practice — original design, not affiliated with, endorsed by, or a copy of any commercial dispensing product.
      </div>

      <nav id="app-nav" class="quick-launch" aria-label="Primary">
        <button class="quick-launch__item is-active" data-nav-view="dashboard" type="button">
          <span class="quick-launch__title">Dashboard</span>
          <span class="quick-launch__meta">Queue overview</span>
        </button>
        <button class="quick-launch__item" data-nav-view="patient-search" type="button">
          <span class="quick-launch__title">Patient Search</span>
          <span class="quick-launch__meta">Profiles &amp; allergies</span>
        </button>
        <button class="quick-launch__item" data-nav-view="new-script" type="button">
          <span class="quick-launch__title">New Script</span>
          <span class="quick-launch__meta">Add to queue</span>
        </button>
        <button class="quick-launch__item" data-nav-view="drug-lookup" type="button">
          <span class="quick-launch__title">Drug Lookup</span>
          <span class="quick-launch__meta">Catalog &amp; stock</span>
        </button>
        <button class="quick-launch__item" data-nav-view="final-check" type="button">
          <span class="quick-launch__title">Final Check</span>
          <span class="quick-launch__meta">Verify before dispense</span>
        </button>
        <button class="quick-launch__item" data-nav-view="history" type="button">
          <span class="quick-launch__title">History</span>
          <span class="quick-launch__meta">Audit trail</span>
        </button>
      </nav>

      <main id="app" class="app-main" aria-live="polite"></main>
    </div>

    <div id="label-modal" class="modal" aria-hidden="true">
      <div class="modal__backdrop" data-close-modal="true"></div>
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="label-modal-title">
        <div class="modal__header">
          <div>
            <p class="eyebrow">Training label preview</p>
            <h2 id="label-modal-title">Dispensing Label</h2>
          </div>
          <button class="icon-button" type="button" data-close-modal="true" aria-label="Close label preview">×</button>
        </div>
        <div id="label-modal-content" class="modal__content"></div>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script defer src="data.js"></script>
    <script defer src="app.js"></script>
  </body>
</html>
